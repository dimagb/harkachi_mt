# Запуск: docker compose up --build
# После старта: http://localhost:8000/api/docs

services:
  forecast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tram-forecast
    ports:
      - "8000:8000"
    volumes:
      # Входные данные: прогноз, история, справочники. Только чтение.
      # Чтобы обновить прогноз, достаточно заменить submission.csv
      # и дёрнуть POST /api/reload — перезапуск не нужен.
      - ./data:/data:ro
      # Изменяемое состояние: события сети, агрегаты приёма, метка
      # перезагрузки. Через эти файлы два воркера видят изменения друг
      # друга, поэтому это именованный том на ФС Linux, а не папка хоста:
      # на пробросе папки Windows атрибуты файлов кешируются, и соседний
      # воркер увидел бы закрытие с опозданием. Переживает перезапуск;
      # сбросить состояние демо — docker compose down -v.
      - runtime:/runtime
    environment:
      DATA_DIR: /data
      RUNTIME_DIR: /runtime
      FORECAST_FILE: submission.csv
    restart: unless-stopped
    # Лимиты из НФТ. Задаются дважды намеренно: ключи cpus/mem_limit
    # действуют при обычном `docker compose up`, а блок deploy.resources —
    # только в Swarm. Если оставить один deploy, лимиты молча не применятся
    # и замеры окажутся сделаны на всей машине, то есть в README попадут
    # цифры, которых на 2 vCPU не будет.
    cpus: 2.0
    mem_limit: 2g
    # Равен mem_limit — swap запрещён. Без этого Docker по умолчанию
    # разрешает ещё столько же swap (MemorySwap = 4 GiB), и требование
    # ТЗ «без swap» держалось бы на удаче, а не на настройке.
    memswap_limit: 2g
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  runtime:
